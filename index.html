<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>16-BYTES // UNSTABLE_BUILD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body { 
            margin: 0; background: #000; overflow: hidden;
            font-family: 'Press Start 2P', cursive; cursor: none;
        }

        #crt-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 100;
        }

        canvas { display: block; image-rendering: pixelated; }

        .menu {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 200; color: #fff; text-align: center;
        }

        #ui-bar {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; align-items: center; justify-content: space-around;
            background: rgba(0,0,0,0.85); border-bottom: 2px solid #444; 
            font-size: 10px; z-index: 50; color: #fff;
        }

        #shop-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
            max-height: 400px; overflow-y: auto; padding: 20px;
        }

        .btn {
            background: #111; border: 2px solid #fff; color: #fff;
            padding: 10px; font-family: 'Press Start 2P';
            cursor: pointer; font-size: 7px;
        }
        .btn:hover { background: #fff; color: #000; }

        #crosshair {
            position: fixed; width: 30px; height: 30px;
            border: 2px solid #fff; pointer-events: none; z-index: 400; 
            transform: translate(-50%, -50%); mix-blend-mode: difference;
        }

        .shake { animation: shakeAnim 0.15s infinite; }
        @keyframes shakeAnim {
            0% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, -3px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>
    <div id="crosshair"></div>

    <div id="main-menu" class="menu">
        <h1 style="font-size: 40px; color: #ff0055; text-shadow: 4px 4px #00f2ff;">16-BYTES</h1>
        <button class="btn" onclick="startGame()" style="font-size: 14px;">MOUNT_DRIVE</button>
    </div>

    <div id="pause-menu" class="menu" style="display:none;">
        <h2 style="color:#00f2ff">CACHE_LOADED</h2>
        <div style="color:yellow; margin: 10px;">BYTES: <span id="shop-bytes">0</span></div>
        <div id="shop-grid"></div>
        <button class="btn" onclick="togglePause()" style="margin-top: 20px;">BACK</button>
    </div>

    <div id="ui-bar">
        <div>$ <span id="byte-count">0</span></div>
        <div id="gravity-status" style="color:#00ff41">GRAVITY: DOWN</div>
        <div>HP: <span id="hp">100</span>%</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let bytes = 0, health = 100, gameRunning = false, isPaused = false;
    let particles = [], fonts = [], glitchGrid = {};
    let gravityDir = { x: 0, y: 1 }; // Default falling down
    const GRID_SIZE = 30;
    const WORDS = ["VOID", "NULL", "ROOT", "KERN", "SYNC", "EXEC", "HALT", "LINK", "DUMP", "PLUG"];

    const THEMES = [
        { name: "CYBER", bg: "#020208", font: "#00f2ff", vir: "#111144", cost: 0 },
        { name: "VIRTUAL", bg: "#150000", font: "#ff0055", vir: "#440011", cost: 200 },
        { name: "MATRIX", bg: "#000a00", font: "#00ff41", vir: "#002200", cost: 500 },
        { name: "AMBER", bg: "#100a00", font: "#ffb300", vir: "#332200", cost: 300 },
        { name: "DOS", bg: "#000000", font: "#ffffff", vir: "#333333", cost: 100 },
        { name: "VAPOR", bg: "#1a002e", font: "#ff71ce", vir: "#01cdfe", cost: 600 },
        { name: "HACKER", bg: "#000000", font: "#39ff14", vir: "#003300", cost: 550 },
        { name: "FROST", bg: "#f0f8ff", font: "#000000", vir: "#add8e6", cost: 900 },
        { name: "LAVA", bg: "#210002", font: "#ff4500", vir: "#4a0000", cost: 850 },
        { name: "TOXIC", bg: "#000000", font: "#ccff00", vir: "#1a3300", cost: 950 }
    ];
    let currentTheme = THEMES[0], ownedThemes = ["CYBER"];

    const shopGrid = document.getElementById('shop-grid');
    THEMES.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'btn'; btn.id = `btn-${t.name}`;
        btn.innerText = `${t.name}\n${t.cost}B`;
        btn.onclick = () => {
            if(ownedThemes.includes(t.name)) currentTheme = t;
            else if(bytes >= t.cost) { bytes -= t.cost; ownedThemes.push(t.name); currentTheme = t; }
            updateUI();
        };
        shopGrid.appendChild(btn);
    });

    window.addEventListener('mousemove', e => {
        crosshair.style.left = e.clientX + 'px';
        crosshair.style.top = e.clientY + 'px';
    });

    window.addEventListener('keydown', e => {
        if(e.key.toLowerCase() === 'p' || e.key === 'Escape') togglePause();
    });

    function triggerShake() {
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 100);
    }

    function spawnParticle(x, y, color) {
        for(let i=0; i<15; i++) {
            particles.push({
                x, y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
                life: 1.0, color: color
            });
        }
    }

    function spawnFont() {
        let side = Math.floor(Math.random() * 4);
        let x, y;
        // Spawn at random edges based on side
        if(side === 0) { x = Math.random()*canvas.width; y = -50; } // Top
        else if(side === 1) { x = Math.random()*canvas.width; y = canvas.height + 50; } // Bottom
        else if(side === 2) { x = -50; y = Math.random()*canvas.height; } // Left
        else { x = canvas.width + 50; y = Math.random()*canvas.height; } // Right

        fonts.push({
            x, y, 
            vx: (Math.random()-0.5)*4, 
            vy: (Math.random()-0.5)*4,
            angle: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random()-0.5)*0.05,
            text: WORDS[Math.floor(Math.random()*WORDS.length)],
            isTarget: Math.random() > 0.8
        });
    }

    canvas.addEventListener('mousedown', e => {
        if(!gameRunning || isPaused) return;
        triggerShake();
        const gx = Math.floor(e.clientX / GRID_SIZE), gy = Math.floor(e.clientY / GRID_SIZE);
        const key = `${gx},${gy}`;

        if(glitchGrid[key]) {
            if(glitchGrid[key].isRoot) { glitchGrid = {}; bytes += 128; spawnParticle(e.clientX, e.clientY, "#00ff00"); }
            else { delete glitchGrid[key]; bytes += 8; spawnParticle(e.clientX, e.clientY, "#ff0000"); }
        }

        fonts.forEach((f, i) => {
            if(Math.hypot(e.clientX - f.x, e.clientY - f.y) < 50) {
                bytes += f.isTarget ? 64 : 16;
                spawnParticle(f.x, f.y, "#fff");
                fonts.splice(i, 1);
            }
        });
        updateUI();
    });

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
        document.getElementById('shop-bytes').innerText = bytes;
    }

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        gameRunning = true;
        for(let i=0; i<15; i++) spawnFont();
        requestAnimationFrame(gameLoop);
        
        // Random Gravity Swaps
        setInterval(() => {
            if(gameRunning && !isPaused) {
                const dirs = [{x:0,y:1,n:"DOWN"}, {x:0,y:-1,n:"UP"}, {x:1,y:0,n:"RIGHT"}, {x:-1,y:0,n:"LEFT"}];
                const pick = dirs[Math.floor(Math.random()*dirs.length)];
                gravityDir = {x: pick.x, y: pick.y};
                document.getElementById('gravity-status').innerText = `GRAVITY: ${pick.n}`;
                triggerShake();
            }
        }, 8000);
    }

    function updateUI() {
        document.getElementById('byte-count').innerText = bytes;
        document.getElementById('hp').innerText = Math.max(0, Math.ceil(health));
    }

    function gameLoop() {
        if(gameRunning && !isPaused) {
            update(); draw();
        }
        requestAnimationFrame(gameLoop);
    }

    function update() {
        // Virus
        if(Math.random() < 0.01) {
            const k = `${Math.floor(Math.random()*canvas.width/GRID_SIZE)},${Math.floor(Math.random()*canvas.height/GRID_SIZE)}`;
            glitchGrid[k] = glitchGrid[k] || { isRoot: true, p: 0 };
        }
        Object.keys(glitchGrid).forEach(k => {
            if(Math.random() < 0.006) {
                const [x, y] = k.split(',').map(Number);
                const n = [[0,1],[0,-1],[1,0],[-1,0]][Math.floor(Math.random()*4)];
                glitchGrid[`${x+n[0]},${y+n[1]}`] = glitchGrid[`${x+n[0]},${y+n[1]}`] || { isRoot: false };
            }
        });

        // Fonts Physics
        if(fonts.length < 20 && Math.random() < 0.05) spawnFont();
        fonts.forEach((f, i) => {
            f.vx += gravityDir.x * 0.1;
            f.vy += gravityDir.y * 0.1;
            f.x += f.vx; f.y += f.vy;
            f.angle += f.rotSpeed;
            // Kill if way off screen
            if(f.x < -200 || f.x > canvas.width + 200 || f.y < -200 || f.y > canvas.height + 200) fonts.splice(i, 1);
        });

        // Particles with erratic physics
        particles.forEach((p, i) => { 
            p.x += p.vx; p.y += p.vy; 
            p.vx *= 0.95; p.vy *= 0.95; // Drag
            p.life -= 0.02; 
            if(p.life <= 0) particles.splice(i, 1); 
        });

        health -= (Object.keys(glitchGrid).length * 0.01);
        if(health <= 0) { gameRunning = false; alert("FATAL ERROR. BYTES: " + bytes); location.reload(); }
    }

    function draw() {
        ctx.fillStyle = currentTheme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Virus Blocks
        Object.keys(glitchGrid).forEach(k => {
            const [gx, gy] = k.split(',').map(Number);
            const n = glitchGrid[k];
            ctx.fillStyle = n.isRoot ? "#fff" : currentTheme.vir;
            if(n.isRoot) { n.p += 0.2; ctx.globalAlpha = 0.4 + Math.sin(n.p)*0.4; }
            else ctx.globalAlpha = 0.7;
            ctx.fillRect(gx*GRID_SIZE, gy*GRID_SIZE, GRID_SIZE-2, GRID_SIZE-2);
            ctx.globalAlpha = 1;
        });

        // Words with Rotation
        fonts.forEach(f => {
            ctx.save();
            ctx.translate(f.x, f.y);
            ctx.rotate(f.angle);
            ctx.font = '14px "Press Start 2P"';
            ctx.fillStyle = f.isTarget ? '#fff' : currentTheme.font;
            ctx.fillText(f.text, 0, 0);
            ctx.restore();
        });

        // Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 4, 4);
        });
        ctx.globalAlpha = 1;
    }
</script>
</body>
</html>
