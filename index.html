<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>16-BYTES // BOUNTY HUNTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body { 
            margin: 0; background: #050510; color: #00f2ff; 
            font-family: 'Press Start 2P', cursive; overflow: hidden;
            cursor: none; /* Hide default mouse for sniper crosshair */
        }

        /* 16-BIT GRID OVERLAY */
        #grid {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(0, 242, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(0, 242, 255, 0.05) 1px, transparent 1px);
            pointer-events: none; z-index: 5;
        }

        canvas { display: block; image-rendering: pixelated; }

        #ui-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px;
            background: rgba(0,0,0,0.9); border-bottom: 3px solid #ff0055;
            display: flex; align-items: center; justify-content: space-around; z-index: 10;
            font-size: 10px;
        }

        #shop {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 10;
        }

        .shop-btn {
            background: #000; border: 2px solid #00f2ff; color: #00f2ff;
            padding: 10px; cursor: pointer; font-family: 'Press Start 2P'; font-size: 8px;
        }
        .shop-btn:hover { background: #ff0055; color: #fff; }

        #crosshair {
            position: fixed; width: 40px; height: 40px;
            border: 2px solid #fff; border-radius: 50%;
            pointer-events: none; z-index: 100; transform: translate(-50%, -50%);
        }
        #crosshair::before { content: ''; position: absolute; top: 50%; left: -10px; width: 60px; height: 2px; background: #fff; }
        #crosshair::after { content: ''; position: absolute; left: 50%; top: -10px; width: 2px; height: 60px; background: #fff; }

        #game-over { 
            display: none; position: absolute; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); text-align: center; 
            background: #000; padding: 40px; border: 4px solid #ff0055; z-index: 110;
        }
    </style>
</head>
<body>

    <div id="grid"></div>
    <div id="crosshair"></div>

    <div id="ui-bar">
        <div>BYTES: <span id="bytes" style="color:yellow">0</span></div>
        <div>HUNT: <span id="target-name" style="color:#fff">---</span></div>
        <div>INTEGRITY: <span id="health">100%</span></div>
    </div>

    <div id="shop">
        <button class="shop-btn" onclick="buyRepair()">[1] REPAIR (50B)</button>
        <button class="shop-btn" onclick="buyCleanse()">[2] CLEANSE (150B)</button>
    </div>

    <div id="game-over">
        <h1 style="color: #ff0055;">FATAL ERROR</h1>
        <button onclick="location.reload()">REBOOT</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const FONTS = [
        { name: 'SANS', style: '30px sans-serif', val: 5 },
        { name: 'SERIF', style: '30px serif', val: 5 },
        { name: 'CODE', style: '30px monospace', val: 15 },
        { name: 'CURSIVE', style: '30px cursive', val: 25 }
    ];

    let bytes = 0;
    let health = 100;
    let target = FONTS[Math.floor(Math.random() * FONTS.length)];
    let items = [];
    let viruses = [];
    let gameActive = true;

    // Custom Mouse
    window.addEventListener('mousemove', (e) => {
        crosshair.style.left = e.clientX + 'px';
        crosshair.style.top = e.clientY + 'px';
    });

    function createItem() {
        const f = FONTS[Math.floor(Math.random() * FONTS.length)];
        return {
            x: 100 + Math.random() * (canvas.width - 200),
            y: 100 + Math.random() * (canvas.height - 200),
            font: f,
            isTarget: f.name === target.name
        };
    }

    function createVirus() {
        viruses.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 40, // Larger size for easier clicking
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5
        });
    }

    // Shop Logic
    function buyRepair() {
        if(bytes >= 50) { bytes -= 50; health = Math.min(100, health + 30); updateUI(); }
    }
    function buyCleanse() {
        if(bytes >= 150) { bytes -= 150; viruses = []; updateUI(); }
    }

    function updateUI() {
        document.getElementById('bytes').innerText = bytes;
        document.getElementById('health').innerText = Math.ceil(health) + "%";
        document.getElementById('target-name').innerText = target.name;
    }

    canvas.addEventListener('mousedown', (e) => {
        if(!gameActive) return;

        // Hit Detection Logic
        let hitSomething = false;

        // 1. Kill Viruses (Sniper logic)
        for(let i = viruses.length - 1; i >= 0; i--) {
            let v = viruses[i];
            let dist = Math.hypot(e.clientX - (v.x + v.size/2), e.clientY - (v.y + v.size/2));
            if(dist < 30) { // Radius of sniper shot
                viruses.splice(i, 1);
                bytes += 10;
                hitSomething = true;
            }
        }

        // 2. Hunt Fonts
        for(let i = items.length - 1; i >= 0; i--) {
            let f = items[i];
            if(e.clientX > f.x && e.clientX < f.x + 120 && e.clientY > f.y - 30 && e.clientY < f.y) {
                let reward = f.font.val;
                if(f.isTarget) reward *= 5; // Target bonus
                bytes += reward;
                items.splice(i, 1);
                items.push(createItem()); // Replace with new font
                hitSomething = true;
            }
        }
        updateUI();
    });

    function gameLoop() {
        if(!gameActive) return;
        ctx.fillStyle = '#050510';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Fonts
        items.forEach(f => {
            ctx.font = f.font.style;
            ctx.fillStyle = f.isTarget ? '#fff' : '#00f2ff33'; // Targets are bright
            ctx.fillText("16-BYTES", f.x, f.y);
        });

        // Draw Viruses
        viruses.forEach((v, i) => {
            v.x += v.vx; v.y += v.vy;
            if(v.x < 0 || v.x > canvas.width - v.size) v.vx *= -1;
            if(v.y < 0 || v.y > canvas.height - v.size) v.vy *= -1;

            ctx.fillStyle = '#ff0055';
            ctx.fillRect(v.x, v.y, v.size, v.size);
            
            // Damage check
            health -= 0.05; 
        });

        if(health <= 0) {
            gameActive = false;
            document.getElementById('game-over').style.display = 'block';
        }

        requestAnimationFrame(gameLoop);
    }

    // Init
    for(let i=0; i<15; i++) items.push(createItem());
    setInterval(() => { if(gameActive) createVirus(); }, 2000);
    updateUI();
    gameLoop();
</script>
</body>
</html>
