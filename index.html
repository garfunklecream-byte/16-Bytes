<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>16-BYTES // GLITCH HUNTER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --pixel-size: 4px;
        }

        body { 
            margin: 0; background: #000; overflow: hidden;
            font-family: 'Press Start 2P', cursive; cursor: none;
        }

        #pixel-screen {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                              linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 100;
        }

        canvas { display: block; image-rendering: pixelated; }

        .menu {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; z-index: 200; color: #fff;
        }

        #ui-bar {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; align-items: center; justify-content: space-around;
            background: rgba(0,0,0,0.8); border-bottom: 2px solid #ff0055; 
            font-size: 10px; z-index: 50; color: #fff;
        }

        .btn {
            background: #222; border: 3px solid #fff; color: #fff;
            padding: 10px 20px; margin: 10px; font-family: 'Press Start 2P';
            cursor: pointer; font-size: 10px;
        }
        .btn:hover { background: #fff; color: #000; }

        #crosshair {
            position: fixed; width: 24px; height: 24px; border: 2px solid #fff;
            pointer-events: none; z-index: 400; transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="pixel-screen"></div>
    <div id="crosshair"></div>

    <div id="main-menu" class="menu">
        <h1 style="color: #00f2ff;">16-BYTES</h1>
        <button class="btn" onclick="startGame()">INITIALIZE</button>
    </div>

    <div id="pause-menu" class="menu" style="display:none;">
        <h2>TERMINAL_PAUSED</h2>
        <div id="shop-bytes" style="color:yellow">BYTES: 0</div>
        <div style="display:flex; gap:10px; margin:20px;">
            <button class="btn" onclick="applyTheme('CYBER')">CYBER_BLUE (0B)</button>
            <button class="btn" onclick="applyTheme('VIRTUAL')">VIRTUAL_RED (500B)</button>
            <button class="btn" onclick="applyTheme('MATRIX')">MATRIX_GREEN (1000B)</button>
        </div>
        <button class="btn" onclick="togglePause()">RESUME</button>
    </div>

    <div id="ui-bar">
        <div>BYTES: <span id="byte-count">0</span></div>
        <div>HP: <span id="hp">100</span>%</div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const crosshair = document.getElementById('crosshair');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // GAME STATE
    let bytes = 0, health = 100, gameRunning = false, isPaused = false;
    let particles = [], fonts = [], glitchGrid = {};
    const GRID_SIZE = 25;
    const WORDS = ["VOID", "ERROR", "NULL", "ROOT", "DATA", "KERNEL", "TRACE", "BYTE", "INDEX"];

    // THEMES
    const THEMES = {
        CYBER: { bg: '#020208', font: '#00f2ff', virus: '#111144', root: '#00f2ff' },
        VIRTUAL: { bg: '#100000', font: '#ff0055', virus: '#440011', root: '#ff9900' },
        MATRIX: { bg: '#000800', font: '#00ff41', virus: '#002200', root: '#ffffff' }
    };
    let currentTheme = THEMES.CYBER;

    window.addEventListener('mousemove', e => {
        crosshair.style.left = e.clientX + 'px';
        crosshair.style.top = e.clientY + 'px';
    });

    window.addEventListener('keydown', e => {
        if(e.key === 'p' || e.key === 'Escape') togglePause();
    });

    function applyTheme(key) {
        let cost = key === 'VIRTUAL' ? 500 : (key === 'MATRIX' ? 1000 : 0);
        if(bytes >= cost) {
            if(cost > 0 && currentTheme !== THEMES[key]) bytes -= cost;
            currentTheme = THEMES[key];
            updateUI();
        }
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-menu').style.display = isPaused ? 'flex' : 'none';
        document.getElementById('shop-bytes').innerText = `BYTES: ${bytes}`;
    }

    function spawnParticle(x, y) {
        for(let i=0; i<8; i++) {
            particles.push({
                x, y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 1.0, color: '#ff0000'
            });
        }
    }

    function spawnFont() {
        fonts.push({
            x: Math.random()*canvas.width, y: Math.random()*canvas.height,
            vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2,
            text: WORDS[Math.floor(Math.random()*WORDS.length)],
            isTarget: Math.random() > 0.8
        });
    }

    canvas.addEventListener('mousedown', e => {
        if(!gameRunning || isPaused) return;
        const gx = Math.floor(e.clientX / GRID_SIZE), gy = Math.floor(e.clientY / GRID_SIZE);
        const key = `${gx},${gy}`;

        if(glitchGrid[key]) {
            if(glitchGrid[key].isRoot) { glitchGrid = {}; bytes += 150; }
            else { delete glitchGrid[key]; bytes += 5; }
            spawnParticle(e.clientX, e.clientY);
            updateUI(); return;
        }

        fonts.forEach((f, i) => {
            if(Math.hypot(e.clientX - f.x, e.clientY - f.y) < 40) {
                bytes += f.isTarget ? 100 : 20;
                spawnParticle(f.x, f.y);
                fonts.splice(i, 1); spawnFont(); updateUI();
            }
        });
    });

    function startGame() {
        document.getElementById('main-menu').style.display = 'none';
        gameRunning = true;
        for(let i=0; i<12; i++) spawnFont();
        requestAnimationFrame(gameLoop);
    }

    function updateUI() {
        document.getElementById('byte-count').innerText = bytes;
        document.getElementById('hp').innerText = Math.max(0, Math.ceil(health));
    }

    function gameLoop() {
        if(gameRunning && !isPaused) {
            update();
            draw();
        }
        requestAnimationFrame(gameLoop);
    }

    function update() {
        // Virus Spawning
        if(Math.random() < 0.005) {
            const k = `${Math.floor(Math.random()*canvas.width/GRID_SIZE)},${Math.floor(Math.random()*canvas.height/GRID_SIZE)}`;
            if(!glitchGrid[k]) glitchGrid[k] = { isRoot: true, p: 0 };
        }

        // Spread logic
        Object.keys(glitchGrid).forEach(k => {
            if(Math.random() < 0.008) {
                const [x, y] = k.split(',').map(Number);
                const n = [[0,1],[0,-1],[1,0],[-1,0]][Math.floor(Math.random()*4)];
                glitchGrid[`${x+n[0]},${y+n[1]}`] = glitchGrid[`${x+n[0]},${y+n[1]}`] || { isRoot: false };
            }
        });

        fonts.forEach(f => {
            f.x += f.vx; f.y += f.vy;
            if(f.x<0 || f.x>canvas.width) f.vx*=-1;
            if(f.y<0 || f.y>canvas.height) f.vy*=-1;
        });

        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; if(p.life<=0) particles.splice(i, 1); });
        health -= (Object.keys(glitchGrid).length * 0.005);
        if(health <= 0) { gameRunning = false; alert("SYSTEM TERMINATED"); location.reload(); }
    }

    function draw() {
        ctx.fillStyle = currentTheme.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        Object.keys(glitchGrid).forEach(k => {
            const [gx, gy] = k.split(',').map(Number);
            const n = glitchGrid[k];
            if(n.isRoot) {
                n.p += 0.2;
                ctx.fillStyle = currentTheme.root;
                ctx.globalAlpha = 0.5 + Math.sin(n.p)*0.5;
            } else {
                ctx.fillStyle = currentTheme.virus;
                ctx.globalAlpha = 0.6;
            }
            ctx.fillRect(gx*GRID_SIZE, gy*GRID_SIZE, GRID_SIZE-2, GRID_SIZE-2);
            ctx.globalAlpha = 1;
        });

        fonts.forEach(f => {
            ctx.font = '16px "Press Start 2P"';
            ctx.fillStyle = f.isTarget ? '#fff' : currentTheme.font;
            ctx.fillText(f.text, f.x, f.y);
        });

        particles.forEach(p => {
            ctx.fillStyle = `rgba(255, 0, 0, ${p.life})`;
            ctx.fillRect(p.x, p.y, 6, 6);
        });
    }
</script>
</body>
</html>
